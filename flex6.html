<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{

        }
        main{
            display: flex;
            flex-direction: column;
            height:100vh;
            overflow: auto;
        }
         main>section{
            flex:1;
            background: grey;
             overflow: auto;
         }
          main>section>p{
            height:2000px;
            background: red;
          }
        footer{
            display: flex;
            border: solid 2px #ccc;
            /* flex-direction:row;  */
            /* 方向 */
             /* row, row-reverse; column-reverse; column; */
            width:100vw;
            height:150px;
            
            /* flex-wrap:wrap */
            flex-flow: row nowrap;
            justify-content: space-evenly;
        }
        footer div{
            flex:1 ;
            text-align: center;
            line-height: 3em;
            /* background:linear-gradient(to bottom, #ddd, #bbb, #ddd); */
            background: blueviolet;
            background-clip: content-box;
              padding:10px
                }

        footer div:nth-child(1){
             flex:1 1 300px;
        }
        footer div:nth-child(2){
             flex:1 2 300px;
        }
        footer div:nth-child(3){
             flex:1 3 300px;
        }
        /* footer div:nth-child(n+2){
            border-left:solid 1px #bbb;
          
        }    */
    </style>
</head>
<body>
    <main>
        <section>
            <p >1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br>1<br></p>
        </section>
        <footer>
            <div>1直播</div>
            <div>2網址</div>
            <div>3後盾</div>   
        </footer>
    </main>
</body>
</html>
