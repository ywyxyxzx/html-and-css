<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
        }
        main{
            height:100vh;
            background:#ddd;
        }
        footer {
            position:fixed;
            height:50px;
            width:100%;
            background: linear-gradient(to bottom, #f3f3f3, #ddd, #f3f3f3);
            border-top:solid 1px #ddd;
            bottom:0;
        }
        footer>div{
            float: left;
            width:33%;
            height:100%;
           text-align: center;
           line-height: 3em;
           color:#555;
        }
        footer>div:nth-child(n+2){
            border-left:solid 1px #ccc;
        }
    </style>
</head>
<body>
    <main>
        
    </main>
    <footer>
        <div>後盾</div>
        <div>直播</div>
        <div>3</div>
    </footer>
</body>
</html>
